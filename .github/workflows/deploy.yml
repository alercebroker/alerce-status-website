name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write  # needed for OIDC
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest lambda/tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production  # requires manual approval in GitHub repo settings

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Package and deploy Lambda
        run: |
          cd lambda
          zip -r ../lambda.zip . --exclude "tests/*" --exclude "__pycache__/*" --exclude "*.pyc"
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://../lambda.zip

      - name: Sync static frontend to site bucket
        run: |
          aws s3 sync frontend/ s3://${{ secrets.SITE_BUCKET }}/ \
            --delete \
            --cache-control "max-age=60"

      - name: Upload incidents.json to data bucket
        run: |
          aws s3 cp incidents/incidents.json s3://${{ secrets.DATA_BUCKET }}/data/incidents.json \
            --cache-control "no-cache" \
            --content-type "application/json"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
