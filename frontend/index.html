<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALeRCE Status</title>
  <link rel="icon" type="image/png" href="assets/alerce_logo_iso.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>

<header>
  <div class="inner">
    <img src="assets/alerce_logo_iso.png" alt="ALeRCE" class="logo-img">
    <h1>ALeRCE Status</h1>
  </div>
</header>

<main>

  <!-- Overall banner -->
  <div id="banner" class="banner operational">
    <div class="dot"></div>
    <span>Loading…</span>
  </div>

  <!-- Stale data warning (hidden until needed) -->
  <div id="stale-warning" class="stale-warning" style="display:none"></div>

  <!-- ZTF APIs -->
  <div class="card">
    <div class="card-title">ZTF APIs</div>
    <div id="apis-rows">
      <!-- populated by app.js -->
      <div class="component-row"><div class="skeleton skeleton-row" style="width:60%"></div></div>
      <div class="component-row"><div class="skeleton skeleton-row" style="width:50%"></div></div>
      <div class="component-row"><div class="skeleton skeleton-row" style="width:55%"></div></div>
    </div>
  </div>

  <!-- Multi-survey (LSST) APIs -->
  <div class="card">
    <div class="card-title">Multi-survey (LSST) APIs</div>
    <div id="apis-lsst-rows">
      <!-- populated by app.js -->
      <div class="component-row"><div class="skeleton skeleton-row" style="width:55%"></div></div>
      <div class="component-row"><div class="skeleton skeleton-row" style="width:50%"></div></div>
    </div>
  </div>

  <!-- Data Access (TAP) -->
  <div class="card">
    <div class="card-title">Data Access (TAP)</div>
    <div id="tap-rows">
      <!-- populated by app.js -->
      <div class="component-row"><div class="skeleton skeleton-row" style="width:50%"></div></div>
      <div class="component-row"><div class="skeleton skeleton-row" style="width:45%"></div></div>
    </div>
  </div>

  <!-- Other APIs -->
  <div class="card">
    <div class="card-title">Other APIs</div>
    <div id="apis-other-rows">
      <!-- populated by app.js -->
      <div class="component-row"><div class="skeleton skeleton-row" style="width:50%"></div></div>
    </div>
  </div>

  <!-- Frontends & Docs -->
  <div class="card">
    <div class="card-title">Frontends &amp; Docs</div>
    <div id="frontends-rows">
      <div class="component-row"><div class="skeleton skeleton-row" style="width:45%"></div></div>
      <div class="component-row"><div class="skeleton skeleton-row" style="width:40%"></div></div>
    </div>
  </div>

  <!-- Incidents & Maintenance -->
  <div class="card">
    <div class="card-title">Incidents &amp; Maintenance</div>
    <div id="incidents-list">
      <div class="incident"><div class="skeleton skeleton-row" style="width:70%"></div></div>
    </div>
  </div>

</main>

<footer>
  <div class="inner">
    <span id="last-updated">Loading…</span>
    &nbsp;·&nbsp;
    <a href="https://alerce.science" target="_blank" rel="noopener">alerce.science</a>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
